<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>RobMine</title>
    <style>
      :root {
        --paper: #f6eedc;
        --accent: #ffb347;
        --glass: rgba(20, 24, 40, 0.6);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b1f3b;
        font-family:
          'Nunito',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--paper);
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #overlay * {
        pointer-events: auto;
      }
      .hud-hint {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        padding: 10px 16px;
        border-radius: 12px;
        background: var(--glass);
        backdrop-filter: blur(6px);
        font-size: 14px;
        letter-spacing: 0.01em;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .hud-hint.hidden {
        opacity: 0;
      }
      .debug {
        position: fixed;
        left: 12px;
        top: 12px;
        min-width: 240px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--glass);
        backdrop-filter: blur(6px);
        font-size: 12px;
        line-height: 1.45;
        font-variant-numeric: tabular-nums;
        white-space: pre;
      }
      .debug button {
        margin-top: 6px;
        padding: 4px 10px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #1b1f3b;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .debug.hidden {
        display: none;
      }
      .crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        pointer-events: none;
        opacity: 0.85;
      }
      .crosshair::before,
      .crosshair::after {
        content: '';
        position: absolute;
        background: #fff;
        mix-blend-mode: difference;
      }
      .crosshair::before {
        left: 8px;
        top: 0;
        width: 2px;
        height: 18px;
      }
      .crosshair::after {
        top: 8px;
        left: 0;
        width: 18px;
        height: 2px;
      }
      .hotbar {
        position: fixed;
        left: 50%;
        bottom: 70px;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        padding: 6px;
        border-radius: 14px;
        background: var(--glass);
        backdrop-filter: blur(6px);
        pointer-events: none;
      }
      .slot {
        position: relative;
        width: 44px;
        height: 44px;
        border-radius: 10px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .slot.active {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(255, 179, 71, 0.35);
      }
      .slot .swatch {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.25);
      }
      .slot .num {
        position: absolute;
        right: 4px;
        top: 2px;
        font-size: 10px;
        opacity: 0.7;
      }
      .picker {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        max-width: 560px;
        max-height: 70vh;
        overflow: auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 12px;
        border-radius: 14px;
        background: var(--glass);
        backdrop-filter: blur(8px);
      }
      .picker.hidden {
        display: none;
      }
      .picker-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border: 0;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--paper);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        text-align: left;
      }
      .picker-item:hover {
        background: rgba(255, 179, 71, 0.35);
      }
      .picker-item .swatch {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        flex: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="overlay">
      <div id="debug" class="debug hidden"></div>
      <div class="crosshair"></div>
      <div id="hint" class="hud-hint">
        Klicken zum Umsehen · WASD laufen · Leertaste springen · Linksklick abbauen · Rechtsklick
        setzen · 1–9 / E Block · F fliegen · F3 Statistik
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
