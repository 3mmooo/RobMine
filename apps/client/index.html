<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>RobMine</title>
    <style>
      :root {
        --paper: #f6eedc;
        --accent: #ffb347;
        --glass: rgba(20, 24, 40, 0.6);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b1f3b;
        font-family:
          'Nunito',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--paper);
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #overlay * {
        pointer-events: auto;
      }
      .hud-hint {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        padding: 10px 16px;
        border-radius: 12px;
        background: var(--glass);
        backdrop-filter: blur(6px);
        font-size: 14px;
        letter-spacing: 0.01em;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .hud-hint.hidden {
        opacity: 0;
      }
      .debug {
        position: fixed;
        left: 12px;
        top: 12px;
        min-width: 240px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--glass);
        backdrop-filter: blur(6px);
        font-size: 12px;
        line-height: 1.45;
        font-variant-numeric: tabular-nums;
        white-space: pre;
      }
      .debug button {
        margin-top: 6px;
        padding: 4px 10px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #1b1f3b;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .debug.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="overlay">
      <div id="debug" class="debug hidden"></div>
      <div id="hint" class="hud-hint">
        Klicken zum Fliegen · WASD bewegen · Leertaste/Shift hoch/runter · Strg schnell · F3
        Statistik
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
