<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>RobMine</title>
    <style>
      :root {
        --paper: #f6eedc;
        --accent: #ffb347;
        --glass: rgba(20, 24, 40, 0.6);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b1f3b;
        font-family:
          'Nunito',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--paper);
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #overlay * {
        pointer-events: auto;
      }
      .hud-hint {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        padding: 10px 16px;
        border-radius: 12px;
        background: var(--glass);
        backdrop-filter: blur(6px);
        font-size: 14px;
        letter-spacing: 0.01em;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .hud-hint.hidden {
        opacity: 0;
      }
      .debug {
        position: fixed;
        left: 12px;
        top: 12px;
        min-width: 240px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--glass);
        backdrop-filter: blur(6px);
        font-size: 12px;
        line-height: 1.45;
        font-variant-numeric: tabular-nums;
        white-space: pre;
      }
      .debug button {
        margin-top: 6px;
        padding: 4px 10px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #1b1f3b;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .debug.hidden {
        display: none;
      }
      .crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        pointer-events: none;
        opacity: 0.85;
      }
      .crosshair::before,
      .crosshair::after {
        content: '';
        position: absolute;
        background: #fff;
        mix-blend-mode: difference;
      }
      .crosshair::before {
        left: 8px;
        top: 0;
        width: 2px;
        height: 18px;
      }
      .crosshair::after {
        top: 8px;
        left: 0;
        width: 18px;
        height: 2px;
      }
      .hotbar {
        position: fixed;
        left: 50%;
        bottom: 70px;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        padding: 6px;
        border-radius: 14px;
        background: var(--glass);
        backdrop-filter: blur(6px);
        pointer-events: none;
      }
      .slot {
        position: relative;
        width: 44px;
        height: 44px;
        border-radius: 10px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .slot.active {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(255, 179, 71, 0.35);
      }
      .slot .swatch {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.25);
      }
      .slot .num {
        position: absolute;
        right: 4px;
        top: 2px;
        font-size: 10px;
        opacity: 0.7;
      }
      .picker {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        max-width: 560px;
        max-height: 70vh;
        overflow: auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 12px;
        border-radius: 14px;
        background: var(--glass);
        backdrop-filter: blur(8px);
      }
      .picker.hidden {
        display: none;
      }
      .picker-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border: 0;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--paper);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        text-align: left;
      }
      .picker-item:hover {
        background: rgba(255, 179, 71, 0.35);
      }
      .picker-item .swatch {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        flex: none;
      }
      .picker-title {
        grid-column: 1 / -1;
        margin: 6px 2px 0;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        opacity: 0.8;
      }
      .picker-note {
        grid-column: 1 / -1;
        font-size: 13px;
        opacity: 0.8;
        padding: 4px 2px;
      }
      .picker-item.recipe {
        grid-column: span 2;
      }
      .picker-item small {
        display: block;
        font-size: 11px;
        opacity: 0.75;
      }
      .picker-item.disabled {
        opacity: 0.4;
        cursor: default;
      }
      .slot.empty .swatch {
        opacity: 0.25;
      }
      .slot .count {
        position: absolute;
        right: 4px;
        bottom: 1px;
        font-size: 11px;
        font-weight: 700;
        text-shadow: 0 1px 2px #000;
      }
      .hidden.hotbar,
      .vitals.hidden {
        display: none;
      }
      .vitals {
        position: fixed;
        left: 50%;
        bottom: 128px;
        transform: translateX(-50%);
        display: flex;
        gap: 28px;
        font-size: 17px;
        line-height: 1;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      .vital span {
        margin: 0 1px;
      }
      .vital.health .full {
        color: #ff5a6a;
      }
      .vital.health .half {
        color: #ff9aa5;
      }
      .vital.hunger .full {
        color: #ffb347;
      }
      .vital.hunger .half {
        color: #ffd699;
      }
      .vital .empty {
        color: rgba(255, 255, 255, 0.25);
      }
      .mode-badge {
        position: fixed;
        right: 12px;
        top: 12px;
        padding: 6px 10px;
        border-radius: 10px;
        background: var(--glass);
        font-size: 12px;
        pointer-events: none;
      }
      .break-progress {
        position: fixed;
        left: 50%;
        top: calc(50% + 18px);
        width: 60px;
        height: 5px;
        margin-left: -30px;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.35);
        overflow: hidden;
        pointer-events: none;
      }
      .break-progress.hidden {
        display: none;
      }
      .break-progress .fill {
        height: 100%;
        width: 0;
        background: var(--accent);
      }
      .hurt-flash {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle, transparent 45%, rgba(220, 30, 50, 0.55));
        opacity: 0;
      }
      .hurt-flash.on {
        animation: hurt 0.45s ease-out;
      }
      @keyframes hurt {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      .name-labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .name-label {
        position: absolute;
        left: 0;
        top: 0;
        padding: 2px 8px;
        border-radius: 8px;
        background: rgba(20, 24, 40, 0.55);
        font-size: 13px;
        white-space: nowrap;
        pointer-events: none;
      }
      .chat-log {
        position: fixed;
        left: 12px;
        bottom: 150px;
        max-width: min(460px, 80vw);
        display: flex;
        flex-direction: column;
        gap: 3px;
        pointer-events: none;
      }
      .chat-line {
        padding: 4px 8px;
        border-radius: 8px;
        background: rgba(20, 24, 40, 0.55);
        font-size: 14px;
        transition: opacity 1s;
      }
      .chat-line.system {
        color: var(--accent);
      }
      .chat-line.fade {
        opacity: 0;
      }
      .chat-input {
        position: fixed;
        left: 12px;
        bottom: 116px;
        width: min(460px, 80vw);
        padding: 8px 10px;
        border: 2px solid var(--accent);
        border-radius: 10px;
        background: rgba(20, 24, 40, 0.85);
        color: var(--paper);
        font: inherit;
        font-size: 14px;
        outline: none;
      }
      .chat-input.hidden {
        display: none;
      }
      .death {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(40, 8, 20, 0.55);
      }
      .death.hidden {
        display: none;
      }
      .death-card {
        padding: 24px 32px;
        border-radius: 16px;
        background: var(--glass);
        backdrop-filter: blur(8px);
        text-align: center;
      }
      .death-card h2 {
        margin: 0 0 6px;
      }
      .death-card button {
        margin-top: 12px;
        padding: 10px 20px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #1b1f3b;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="overlay">
      <div id="debug" class="debug hidden"></div>
      <div class="crosshair"></div>
      <div id="hint" class="hud-hint">
        Klicken zum Umsehen · WASD laufen · Linksklick halten = abbauen · Rechtsklick setzen/essen ·
        E Inventar &amp; Herstellen · C Kreativ · F3 Statistik
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
